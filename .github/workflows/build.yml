name: Compila APK
on:
  push:
    branches: [main, "tappa-*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verifica configurazione e account (senza mostrare chiavi)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          base = "https://sicpnokpgjqwnhzlznvm.supabase.co"
          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""
          code, body = get(base + "/storage/v1/object/public/lumen/app-config.json")
          key = ""
          if code == 200:
              for p in json.loads(body).get("providers", []):
                  if p.get("type") == "tmdb":
                      key = p.get("options", {}).get("tmdbKey", "")
          print("configurazione pubblica:", code, "- chiave TMDB presente:", bool(key))
          if key and not key.startswith("eyJ"):
              q = urllib.parse.urlencode({"api_key": key, "language": "it-IT"})
              print("catalogo TMDB:", get("https://api.themoviedb.org/3/trending/all/week?" + q)[0])
          print("server account:", get(base + "/functions/v1/lumen-auth/health")[0])
          print("aggiornamenti:", get(base + "/storage/v1/object/public/lumen/android-tv/version.json")[0])
          PY
      - name: Test e compilazione
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-TV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Pubblica l'aggiornamento per la TV
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BASE: https://sicpnokpgjqwnhzlznvm.supabase.co/storage/v1/object
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_KEY assente: pubblicazione saltata"
            exit 0
          fi
          # Indica solo il tipo di chiave, mai il suo valore.
          case "$SERVICE_KEY" in
            eyJ*) KIND="JWT, ruolo: $(printf %s "$SERVICE_KEY" | cut -d. -f2 | tr '_-' '/+' | python3 -c "import sys,base64,json;s=sys.stdin.read().strip();print(json.loads(base64.b64decode(s+'='*(-len(s)%4))).get('role','?'))")" ;;
            sb_secret_*) KIND="sb_secret" ;;
            sb_publishable_*) KIND="sb_publishable" ;;
            *) KIND="non riconosciuto" ;;
          esac
          echo "Tipo di SUPABASE_SERVICE_KEY: $KIND"
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          AUTH=(-H "apikey: $SERVICE_KEY")
          case "$SERVICE_KEY" in eyJ*) AUTH+=(-H "Authorization: Bearer $SERVICE_KEY");; esac
          upload() {
            curl --fail-with-body -sS -X POST "$BASE/lumen/android-tv/$2" "${AUTH[@]}" \
              -H "x-upsert: true" -H "cache-control: max-age=60" -H "Content-Type: $3" --data-binary "@$1"
          }
          upload app/build/outputs/apk/release/app-release.apk Lumen-TV.apk application/vnd.android.package-archive
          printf '{"versionCode":%s,"versionName":"%s","url":"%s/public/lumen/android-tv/Lumen-TV.apk?v=%s"}' \
            "$GITHUB_RUN_NUMBER" "$NAME" "$BASE" "$GITHUB_RUN_NUMBER" > version.json
          upload version.json version.json application/json
          echo
          echo "Controllo pubblico version.json: $(curl -s "$BASE/public/lumen/android-tv/version.json?t=$GITHUB_RUN_ID")"
          echo "Controllo pubblico APK: $(curl -sIL -o /dev/null -w '%{http_code} %{size_download} %{content_type}' "$BASE/public/lumen/android-tv/Lumen-TV.apk?v=$GITHUB_RUN_NUMBER")"
