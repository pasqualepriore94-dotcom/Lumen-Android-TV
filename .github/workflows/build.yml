name: Compila APK
on:
  push:
    branches: [main, "tappa-*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test e compilazione
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-TV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Pubblica l'aggiornamento per la TV
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BASE: https://sicpnokpgjqwnhzlznvm.supabase.co/storage/v1/object
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_KEY assente: pubblicazione saltata"
            exit 0
          fi
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          upload() {
            curl --fail-with-body -sS -X POST "$BASE/lumen/android-tv/$2" \
              -H "Authorization: Bearer $SERVICE_KEY" -H "x-upsert: true" \
              -H "cache-control: max-age=60" -H "Content-Type: $3" --data-binary "@$1"
          }
          upload app/build/outputs/apk/release/app-release.apk Lumen-TV.apk application/vnd.android.package-archive
          printf '{"versionCode":%s,"versionName":"%s","url":"%s/public/lumen/android-tv/Lumen-TV.apk?v=%s"}' \
            "$GITHUB_RUN_NUMBER" "$NAME" "$BASE" "$GITHUB_RUN_NUMBER" > version.json
          upload version.json version.json application/json
